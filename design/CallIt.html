<!--
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  CallIt — gamified BTC prediction PWA · callit.markets
  Design rationale (for review):

  • DIRECTION: "Modern game UI, sleek but juicy" — dark navy arcade shell,
    chunky 3D press-down buttons (hard bottom-edge shadows, squash on tap),
    electric green/red for UP/DOWN, gold reserved for money + streaks.
  • TYPE: Lilita One for display/numbers (round, game-y, legible),
    Nunito 700–1000 for UI. Tabular numerals everywhere money ticks.
  • MECHANICS MODELED (per DeepBook Predict notes):
    - Odds from a simulated SVI vol surface → multipliers drift each refresh
      (pills shimmer on update).
    - Rounds = oracle expiries: 5m / 15m / 1h chips.
    - Cash-out = early redeem priced off the live surface (hold-to-confirm).
    - Settlement: oracle expiry → keeper auto-claims → payout lands.
      The win celebration is the demo centerpiece: flash, confetti, coin
      shower, payout count-up, streak flame level-up.
  • DEMO TIME: rounds run on accelerated world-time (default 30×) so a 15m
    round settles in ~30s during a pitch. Tweakable.
  • MONEY: real amounts, dUSDC on Sui testnet. Faucet in wallet sheet.
  • PERSISTENCE: balance, streak, badges, history in localStorage.
  • TWEAKS: color theme, juice intensity, demo speed.
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"></link>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900;1000&display=swap" rel="stylesheet"></link>
<style>
  :root {
    --bg-page: #07090F;
    --bg: #0B0E16;
    --card: #141927;
    --card-2: #1A2133;
    --line: rgba(255,255,255,0.07);
    --text: #F2F5FF;
    --muted: #8B93AC;
    --gold: #FFC53D;
    --gold-deep: #B97E0A;
    --sui: #4DA2FF;
    --font-display: 'Lilita One', system-ui, sans-serif;
    --font-ui: 'Nunito', system-ui, sans-serif;
  }
  html, body { margin: 0; padding: 0; background: var(--bg-page); }
  body {
    font-family: var(--font-ui);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
  }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }

  .num { font-variant-numeric: tabular-nums; }
  .display { font-family: var(--font-display); font-weight: 400; letter-spacing: 0.02em; }

  ::-webkit-scrollbar { width: 0; height: 0; }

  /* ── keyframes ────────────────────────────────── */
  @keyframes ci-pop {
    0% { transform: scale(0.6); opacity: 0; }
    60% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes ci-pop-big {
    0% { transform: scale(0.3) rotate(-6deg); opacity: 0; }
    55% { transform: scale(1.15) rotate(2deg); opacity: 1; }
    75% { transform: scale(0.96) rotate(-1deg); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes ci-rise {
    from { transform: translateY(18px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes ci-shake {
    0%, 100% { transform: translate(0, 0); }
    15% { transform: translate(calc(-7px * var(--jscale, 1)), 2px); }
    30% { transform: translate(calc(6px * var(--jscale, 1)), -2px); }
    45% { transform: translate(calc(-5px * var(--jscale, 1)), 1px); }
    60% { transform: translate(calc(4px * var(--jscale, 1)), -1px); }
    75% { transform: translate(calc(-2px * var(--jscale, 1)), 0); }
  }
  @keyframes ci-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(calc(1 + 0.04 * var(--jscale, 1))); }
  }
  @keyframes ci-glow-pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
  @keyframes ci-shimmer {
    from { transform: translateX(-110%) skewX(-18deg); }
    to { transform: translateX(240%) skewX(-18deg); }
  }
  @keyframes ci-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @keyframes ci-flame {
    0%, 100% { transform: rotate(45deg) scale(1); }
    30% { transform: rotate(43deg) scale(1.08, 0.95); }
    60% { transform: rotate(47deg) scale(0.94, 1.1); }
  }
  @keyframes ci-flash {
    0% { opacity: 0.9; }
    100% { opacity: 0; }
  }
  @keyframes ci-ring-spin {
    to { transform: rotate(360deg); }
  }
  @keyframes ci-tick-up { 0% { color: var(--up); transform: translateY(2px);} 100% { color: var(--text); transform: translateY(0);} }
  @keyframes ci-tick-down { 0% { color: var(--down); transform: translateY(-2px);} 100% { color: var(--text); transform: translateY(0);} }
  @keyframes ci-coin-spin {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }
  @keyframes ci-marquee {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  .ci-pressable {
    transition: transform 0.07s ease, box-shadow 0.07s ease, filter 0.12s ease;
    user-select: none;
  }
  .ci-pressable:active { filter: brightness(1.1); }
</style>
