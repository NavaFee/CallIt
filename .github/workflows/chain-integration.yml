name: Chain integration (testnet)

# Manual: spends real testnet funds from the CI wallet.
# Requires repo secret TESTNET_PRIVATE_KEY (suiprivkey1..., funded with
# SUI gas + a few dUSDC).
on:
  workflow_dispatch:

jobs:
  roundtrip:
    name: Real mint → position read → redeem on testnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run chain round-trip test
        run: pnpm --filter @callit/core test
        env:
          RUN_CHAIN_TESTS: '1'
          PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
